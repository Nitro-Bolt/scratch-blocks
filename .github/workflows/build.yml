name: Build and Push

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs: {}

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          java-package: "jre"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run prepublish

      - name: Update Translations
        run: pnpm run translate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages

      - name: Commit and Push Build
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"

          mkdir ../build-output
          cp -r dist/ media/ msg/ \
            blockly_compressed_vertical.js \
            blocks_compressed_vertical.js \
            blocks_compressed.js \
            blockly_uncompressed_vertical.js \
            package.json \
            pnpm-lock.yaml \
            ../build-output/

          git fetch origin develop-builds
          git checkout -f develop-builds

          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

          cp -r ../build-output/* .

          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build: ${GITHUB_SHA::7}"
            git push origin develop-builds
          fi

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: [build, deploy-pages]
    uses: ./.github/workflows/notify-dependents.yml
    secrets: inherit
